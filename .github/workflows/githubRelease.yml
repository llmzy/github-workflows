name: tag and github release
#
#
#
#
# -----------------------------------------------------------------------
# NOTE: This workflow is deprecated in favor of create-github-release.yml
# -----------------------------------------------------------------------
#
#
#
#
on:
  workflow_call:
    secrets:
      SVC_CLI_BOT_GITHUB_TOKEN:
        description: a github PAT with repo access

    inputs:
      prerelease:
        type: boolean
        required: false
        default: false
        description: use a prerelease instead of a regular release
      input-file:
        description: Path to an existing changelog file to use as base
        required: false
        type: string
      first-release-date:
        description: "If specified, only keep releases since this date (YYYY-MM-DD format)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation warning
        run: |
          echo "::warning::WARNING: This workflow is deprecated in favor of create-github-release.yml\n
                                    Update your worklows to use the new flow that supports prereleases\n
                                    Docs: https://github.com/llmzy/github-workflows#prereleases\n
                                    Example: https://github.com/llmzy/plugin-source/pull/927/files"
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - uses: llmzy/github-workflows/.github/actions/getPreReleaseTag@main
        id: distTag
        if: inputs.prerelease

      - name: prerelease package.json validation
        if: inputs.prerelease && !steps.distTag.outputs.tag
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Prerelease requires a dist tag name in your package.json like beta in 1.1.1-beta.0')

      - name: Count releases since cutoff date
        id: release-count
        if: ${{ inputs.first-release-date != '' }}
        uses: llmzy/github-workflows/.github/actions/countReleasesSinceDate@main
        with:
          cutoff-date: ${{ inputs.first-release-date }}
          default-count: '0'

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@67139193614f5b9e8db87da1bd4240922b34d765
        with:
          git-user-name: svc-cli-bot
          git-user-email: svc_cli_bot@salesforce.com
          github-token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
          tag-prefix: ""
          # Use calculated release count if available, otherwise keep all releases (0)
          release-count: ${{ inputs.first-release-date != '' && steps.release-count.outputs.release-count || '0' }}
          pre-release: ${{ inputs.prerelease }}
          pre-release-identifier: ${{ steps.distTag.outputs.tag }}
          # ternary-ish: https://github.com/actions/runner/issues/409#issuecomment-752775072
          output-file: ${{ inputs.prerelease && 'false' || 'CHANGELOG.md' }} # If prerelease, do not write the changelog file
          input-file: ${{ inputs.input-file }}
      - name: Create Github Release
        uses: actions/create-release@v1
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          prerelease: ${{ inputs.prerelease }}
