on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        description: npm token
      AWS_ACCESS_KEY_ID:
        description: AWS access key id. Only required if sign = true
      AWS_SECRET_ACCESS_KEY:
        description: AWS secret access key. Only required if sign = true
      SVC_CLI_BOT_GITHUB_TOKEN:
        description: GitHub token for package publishing. Required if publishToGithubPackages is true
        required: false

    inputs:
      tag:
        required: false
        description: tag used to publish to npm
        default: latest
        type: string
      sign:
        required: false
        description: signs the package using llmzy-release if set to true
        default: false
        type: boolean
      dryrun:
        required: false
        description: if true, the job will run but will not publish to npm or push to git
        default: false
        type: boolean
      prerelease:
        required: false
        description: if true, it will use the version <version>-<branch>.0
        type: boolean
        default: false
      nodeVersion:
        description: version of node to use.  It's better to specify latest, lts/* or lts/-1 than to hardode numbers
        type: string
        default: lts/*
        required: false
      ctc:
        description: |
          Use CTC.  Requires environment to contain
          SF_CHANGE_CASE_SFDX_AUTH_URL, SF_CHANGE_CASE_TEMPLATE_ID, SF_CHANGE_CASE_CONFIGURATION_ITEM.
          Also requires a static ip runner (you can't use ubuntu-latest)
        type: boolean
        required: false
      runsOn:
        description: the runner.  Only needed if you need a non-public runner (ex, for git checkout from IP restricted private repo)
        default: ubuntu-latest
        required: false
        type: string
      githubTag:
        description: the github release tag that you want to publish as an npm package
        required: true
        type: string
      package-manager:
        type: string
        description: "Package manager to use (npm or yarn)"
        default: "yarn"
        required: false
      publishToGithubPackages:
        type: boolean
        description: "If true, publish to GitHub Packages instead of npm"
        default: false
        required: false
      scope:
        type: string
        description: "Scope for the package (e.g., @organization). Required if publishToGithubPackages is true"
        required: false
      git_ref_name:
        description: "Alternative git ref name to use instead of github.ref_name (useful for workflow_run events)"
        required: false
        type: string
      package-directory:
        description: "Optional subdirectory where the package to be published is located."
        required: false
        type: string
        default: "."

jobs:
  check-publish:
    if: inputs.githubTag != ''
    outputs:
      published: ${{ steps.is-published.outputs.published }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Determine effective ref name
        id: effective_ref
        run: |
          if [ -n "$INPUTS_GIT_REF_NAME" ]; then
            echo "name=$INPUTS_GIT_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_GIT_REF_NAME: ${{ inputs.git_ref_name }}
          
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.githubTag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.nodeVersion }}
          registry-url: ${{ inputs.publishToGithubPackages && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.scope }}

      - name: Is published
        id: is-published
        run: |
          # This script checks if a specific version of an npm package has
          # already been published to either npmjs.org or GitHub Packages. It's
          # designed to work correctly even if the package resides in a
          # subdirectory of the repository (specified by INPUTS_PACKAGE_DIRECTORY).
          #
          # Workflow:
          # 1. Determine the effective package directory:
          #    - If INPUTS_PACKAGE_DIRECTORY is provided and is not ".", change
          #      to that directory.
          #    - Otherwise, operate from the current directory (repository root).
          # 2. Store the target version (from INPUTS_GITHUB_TAG) in a variable for clarity.
          # 3. Check publication status based on the target registry
          #    (INPUTS_PUBLISH_TO_GITHUB_PACKAGES): 
          #    a. If targeting GitHub Packages: 
          #       - Verify that a 'package.json' file exists in the current directory. 
          #       - Extract the actual package name from 'package.json' 
          #         (e.g., '@scope/package-name'). This is crucial because the npm 
          #         package name might differ from the GitHub repository name. 
          #       - Use 'npm view <actual_package_name>@<version> version --json' to check if  
          #         the specific version exists in the GitHub Packages registry
          #         associated with the scope. 
          #    b. If targeting npmjs.org: 
          #       - Use 'npm view .@<version> version --json' to check if the specific
          #         'npm view .@<version> version --json' to check if the specific
          #         version of the package in the current directory ('.') exists
          #         on npmjs.org.
          # 4. Interpret the 'npm view' response:
          #    - If 'npm view' successfully finds the version, it returns the
          #      version string (e.g., "1.0.0").
          #    - If the version is not found, 'npm view' fails, and the script
          #      captures "Not published".
          # 5. Compare the response with the target version string (ensuring to
          #    match the quotes returned by 'npm view --json').
          # 6. Set the 'published' output variable to "true" or "false" based on
          #    the comparison. This output is used by subsequent steps in the
          #    GitHub Actions workflow.
          
          # 1. Determine the effective package directory
          effective_package_dir="${INPUTS_PACKAGE_DIRECTORY:-.}" # Default to . if empty or not set
          if [ "$effective_package_dir" != "." ]; then
            echo "Changing to directory: $effective_package_dir"
            cd "$effective_package_dir"
          else
            echo "Operating in root directory."
          fi

          # 2. Store the target version (from INPUTS_GITHUB_TAG) in a variable for clarity.
          PACKAGE_VERSION_FROM_INPUT="$INPUTS_GITHUB_TAG"

          # 3. Check publication status based on the target registry
          # 4. Interpret the 'npm view' response (handled by '|| echo "Not published"' below)
          if [ "$INPUTS_PUBLISH_TO_GITHUB_PACKAGES" = "true" ]; then
            # 3a. If targeting GitHub Packages:
            # For GitHub Packages, read package name from package.json in the
            # current directory
            if [ ! -f package.json ]; then
              echo "Error: package.json not found in $(pwd)"
              exit 1
            fi
            ACTUAL_PACKAGE_NAME=$(node -p "require('./package.json').name")
            if [ -z "$ACTUAL_PACKAGE_NAME" ]; then
              echo "Error: Could not extract package name from package.json in $(pwd)"
              exit 1
            fi
            echo "Checking GitHub Packages for: $ACTUAL_PACKAGE_NAME@$PACKAGE_VERSION_FROM_INPUT"
            # Note: The setup-node action with scope should handle how npm view
            # resolves names within that scope.
            RESPONSE=$(npm view "$ACTUAL_PACKAGE_NAME@$PACKAGE_VERSION_FROM_INPUT" version --json --silent || echo "Not published")
          else
            # 3b. If targeting npmjs.org:
            # For npm, check if the package exists in the npm registry using
            # local package.json context
            echo "Checking npmjs.org for package in current directory with version: $PACKAGE_VERSION_FROM_INPUT"
            RESPONSE=$(npm view ".@$PACKAGE_VERSION_FROM_INPUT" version --json --silent || echo "Not published")
          fi

          # 5. Compare the response with the target version string
          # The response from `npm view ... version --json` is the version
          # string itself, e.g., "1.2.3" (with quotes).          
          # 6. Set the 'published' output variable          
          if [ "$RESPONSE" = "\"\"$PACKAGE_VERSION_FROM_INPUT\"\"" ]; then # Compare with quoted version string            
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Package version $PACKAGE_VERSION_FROM_INPUT found."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Package version $PACKAGE_VERSION_FROM_INPUT not found. npm view response: $RESPONSE"
          fi
        env:
          INPUTS_GITHUB_TAG: ${{ inputs.githubTag }}
          INPUTS_PUBLISH_TO_GITHUB_PACKAGES: ${{ inputs.publishToGithubPackages }}
          INPUTS_SCOPE: ${{ inputs.scope }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          NODE_AUTH_TOKEN: ${{ inputs.publishToGithubPackages && secrets.SVC_CLI_BOT_GITHUB_TOKEN || secrets.NPM_TOKEN }}
          INPUTS_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}

      - run: echo "[INFO] Is package published:\ $STEPS_IS_PUBLISHED_PUBLISHED"
        env:
          STEPS_IS_PUBLISHED_PUBLISHED: ${{ steps.is-published.outputs.published }}

      - name: Fail if published
        if: steps.is-published.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = 'The version \'' + process.env.INPUTS_GITHUB_TAG + '\' has already been published to ' +
              (process.env.INPUTS_PUBLISH_TO_GITHUB_PACKAGES === 'true' ? 'GitHub Packages' : 'npm');
            core.setFailed(message);
        env:
          INPUTS_GITHUB_TAG: ${{ inputs.githubTag }}
          INPUTS_PUBLISH_TO_GITHUB_PACKAGES: ${{ inputs.publishToGithubPackages }}

  ctc-open:
    needs: [check-publish]
    if: inputs.ctc && needs.check-publish.outputs.published == 'false'
    uses: llmzy/github-workflows/.github/workflows/ctcOpen.yml@main
    secrets: inherit

  npm-publish:
    needs: [check-publish, ctc-open]
    if: ${{ always() && needs.check-publish.outputs.published == 'false' && (!inputs.ctc || (inputs.ctc && needs.ctc-open.outputs.changeCaseId)) }}
    runs-on: ${{ inputs.runsOn }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate inputs
        if: inputs.publishToGithubPackages == 'true' || inputs.publishToGithubPackages == true
        run: |
          if [ -z "$INPUTS_SCOPE" ]; then
            echo "Error: scope is required when publishing to GitHub Packages"
            exit 1
          fi
        env:
          INPUTS_SCOPE: ${{ inputs.scope }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.githubTag }}

      - name: Check for .npmrc_ci
        id: check-npmrc
        run: |
          if [ -f .npmrc_ci ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo ".npmrc_ci found at root."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo ".npmrc_ci not found at root."
          fi
        # No working-directory, path is handled in the script

      - uses: actions/setup-node@v4
        if: steps.check-npmrc.outputs.exists == 'true'
        with:
          node-version: ${{ inputs.nodeVersion }}
          cache: ${{ inputs.package-manager }}
        # No working-directory

      - name: Prepare npmrc
        if: steps.check-npmrc.outputs.exists == 'true'
        run: envsubst < .npmrc_ci > .npmrc
        # working-directory: ${{ inputs.package-directory }} # Removed,
        # .npmrc_ci and .npmrc at root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - name: Debug npmrc
        if: steps.check-npmrc.outputs.exists == 'true'
        run: cat .npmrc
        # working-directory: ${{ inputs.package-directory }} # Removed, .npmrc
        # is at root

      - uses: actions/setup-node@v4
        if: steps.check-npmrc.outputs.exists == 'false'
        # No working-directory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
        with:
          node-version: ${{ inputs.nodeVersion }}
          cache: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.publishToGithubPackages && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.scope }}

      - name: Install dependencies
        if: inputs.package-manager == 'yarn'
        run: yarn install --frozen-lockfile
        # working-directory: ${{ inputs.package-directory }} # Removed, install
        # at root

      - name: npm install
        if: inputs.package-manager == 'npm'
        run: npm ci
        # working-directory: ${{ inputs.package-directory }} # Removed, install
        # at root

      - name: Build with yarn
        if: inputs.package-manager == 'yarn'
        run: yarn build
        # working-directory: ${{ inputs.package-directory }} # Removed, build
        # from root

      - name: Build with npm
        if: inputs.package-manager == 'npm'
        run: npm run build
        # working-directory: ${{ inputs.package-directory }} # Removed, build
        # from root

      - run: |
          # .npmrc is expected to be at the root now if it was created
          if [ -f .npmrc ]; then
            echo "Copying .npmrc from root to ~/.npmrc"
            cp .npmrc ~/.npmrc
          else
            echo ".npmrc not found at root. Global npmrc will be used or setup-node config."
          fi
          npm install -g @llmzy/release-management
        # No working-directory for the step itself
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - name: NPM Release
        run: |
          effective_package_dir="${INPUTS_PACKAGE_DIRECTORY:-.}" # Default to .
          if [ "$effective_package_dir" != "." ] && [ -n "$effective_package_dir" ]; then
            echo "Changing to directory for release: $effective_package_dir"
            cd "$effective_package_dir"
          else
            echo "Releasing from root directory."
          fi
          llmzy-release npm:package:release \
            --githubtag "$INPUTS_GITHUB_TAG" \
            --npmtag "$INPUTS_TAG" \
            --no-install \
            ${{ inputs.dryrun && '--dryrun' || '' }} \
            ${{ inputs.prerelease && format('--prerelease {0}', steps.effective_ref.outputs.name) || '' }} \
            ${{ inputs.sign && '--sign' || '' }}
        env:
          INPUTS_GITHUB_TAG: ${{ inputs.githubTag }}
          INPUTS_TAG: ${{ inputs.tag }}
          NPM_TOKEN: ${{ inputs.publishToGithubPackages && secrets.SVC_CLI_BOT_GITHUB_TOKEN || secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ inputs.publishToGithubPackages && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org/' }}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          INPUTS_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}

      - run: rm ~/.npmrc

  ctcCloseSuccess:
    needs: [ctc-open, npm-publish]
    if: needs.ctc-open.result == 'success' && needs.npm-publish.result == 'success' && needs.ctc-open.outputs.changeCaseId
    uses: llmzy/github-workflows/.github/workflows/ctcClose.yml@main
    secrets: inherit
    with:
      changeCaseId: ${{needs.ctc-open.outputs.changeCaseId}}

  ctcCloseFail:
    needs: [ctc-open, npm-publish]
    if: always() && inputs.ctc && needs.ctc-open.outputs.changeCaseId && (needs.ctc-open.result != 'success' || needs.npm-publish.result != 'success')
    uses: llmzy/github-workflows/.github/workflows/ctcClose.yml@main
    secrets: inherit
    with:
      changeCaseId: ${{ needs.ctc-open.outputs.changeCaseId }}
      status: Not Implemented
