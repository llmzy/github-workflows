name: create-github-release
on:
  workflow_call:
    secrets:
      SVC_CLI_BOT_GITHUB_TOKEN:
        description: A Github PAT with repo write access.
        required: true
      LLMZY_CI_PRIVATE_KEY:
        description: Private key for Git commit signing
        required: true

    inputs:
      prerelease:
        type: string
        description: "Name to use for the prerelease: beta, dev, etc."
      skip-on-empty:
        type: boolean
        default: true
        description: "Should release be skipped if there are no semantic commits?"
      generate-readme:
        type: boolean
        default: true
        description: "Generate oclif readme"
      readme-multi:
        type: boolean
        description: "Create a different markdown page for each topic."
        default: false
      package-manager:
        type: string
        description: "Package manager to use (npm or yarn)"
        default: "yarn"
        required: false
      input-file:
        description: "Path to an existing changelog file to prepend, ignoring first-release-date"
        required: false
        type: string
      first-release-date:
        description: "If specified, only keep releases since this date (YYYY-MM-DD format)"
        required: false
        type: string
      git_ref_name:
        description: "Alternative git ref name to use instead of github.ref_name (useful for workflow_run events)"
        required: false
        type: string

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - name: Determine effective ref name
        id: effective_ref
        run: |
          if [ -n "$INPUTS_GIT_REF_NAME" ]; then
            echo "name=$INPUTS_GIT_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_GIT_REF_NAME: ${{ inputs.git_ref_name }}
          
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
          ref: ${{ steps.effective_ref.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager == 'yarn'
        uses: llmzy/github-workflows/.github/actions/yarnInstallWithRetries@main

      - name: Install dependencies
        if: inputs.package-manager == 'npm'
        uses: llmzy/github-workflows/.github/actions/npmInstallWithRetries@main

      - name: Get Github user info
        id: github-user-info
        uses: llmzy/github-workflows/.github/actions/getGithubUserInfo@main
        with:
          SVC_CLI_BOT_GITHUB_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
      
      - name: Configure Git signing
        uses: llmzy/github-workflows/.github/actions/configureGitSigning@main
        with:
          private_key: ${{ secrets.LLMZY_CI_PRIVATE_KEY }}
          github_token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - uses: llmzy/github-workflows/.github/actions/getPreReleaseTag@main
        id: distTag

      - name: Fail if prerelease on main
        if: steps.effective_ref.outputs.name == 'main' && inputs.prerelease
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Do not create a prerelease on "main". You can create a prerelease on a branch and when it is merged it will create a non-prerelease Release. For example: 1.0.1-beta.2 will release as 1.0.1 when merged into main.')

      - name: Determine prerelease name
        id: prereleaseTag
        # Only run this step if the ref is not main
        # This will allow us to merge a prerelease PR into main and have it release as a normal release
        if: steps.effective_ref.outputs.name != 'main'
        run: |
          if [ -n "$INPUTS_PRERELEASE" ]; then
            echo "[INFO] Prerelease input passed in, using: $INPUTS_PRERELEASE"
            echo "tag=$INPUTS_PRERELEASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$STEPS_DISTTAG_TAG" ]; then
            echo "[INFO] Prerelease tag found in package.json, using: $STEPS_DISTTAG_TAG"
            echo "tag=$STEPS_DISTTAG_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$EFFECTIVE_REF_NAME" =~ ^prerelease/.* ]]; then
            echo "[INFO] Prerelease branch found but no prerelease tag, using default: dev"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_PRERELEASE: ${{ inputs.prerelease }}
          STEPS_DISTTAG_TAG: ${{ steps.distTag.outputs.tag }}
          EFFECTIVE_REF_NAME: ${{ steps.effective_ref.outputs.name }}

      - name: Generate oclif readme
        if: ${{ inputs.generate-readme }}
        uses: llmzy/github-workflows/.github/actions/generateOclifReadme@main
        with:
          skip-on-empty: ${{ inputs.skip-on-empty }}
          pre-release: ${{ steps.prereleaseTag.outputs.tag && 'true' || 'false' }}
          pre-release-identifier: ${{ steps.prereleaseTag.outputs.tag }}
          multi: ${{ inputs.readme-multi }}
          package-manager: ${{ inputs.package-manager }}

      - name: Count releases since cutoff date
        id: release-count
        if: ${{ inputs.first-release-date != '' }}
        uses: llmzy/github-workflows/.github/actions/countReleasesSinceDate@main
        with:
          cutoff-date: ${{ inputs.first-release-date }}
          default-count: '0'

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@67139193614f5b9e8db87da1bd4240922b34d765
        with:
          git-user-name: ${{ steps.github-user-info.outputs.username }}
          git-user-email: ${{ steps.github-user-info.outputs.email }}
          github-token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
          tag-prefix: ""
          git-branch: ${{ steps.effective_ref.outputs.name }}
          # Use calculated release count if available, otherwise keep all releases (0)
          release-count: ${{ inputs.first-release-date != '' && steps.release-count.outputs.release-count || '0' }}
          skip-on-empty: ${{ inputs.skip-on-empty }}
          pre-release: ${{ steps.prereleaseTag.outputs.tag && 'true' || 'false' }}
          pre-release-identifier: ${{ steps.prereleaseTag.outputs.tag }}
          # ternary-ish: https://github.com/actions/runner/issues/409#issuecomment-752775072
          output-file: ${{ steps.prereleaseTag.outputs.tag && 'false' || 'CHANGELOG.md' }} # If prerelease, do not write the changelog file
          # Note that if input-file is specified, it will be used as the base changelog file
          # and only one new changelog entry will be prepended to it.
          input-file: ${{ inputs.input-file }}

      - name: Create Github Release
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          name: ${{ steps.changelog.outputs.tag }}
          tag: ${{ steps.changelog.outputs.tag }}
          commit: ${{ steps.effective_ref.outputs.name }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          prerelease: ${{ steps.prereleaseTag.outputs.tag && 'true' || 'false' }}
          token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
          skipIfReleaseExists: true

      - name: Cleanup Git signing
        if: always()
        uses: llmzy/github-workflows/.github/actions/cleanupGitSigning@main
