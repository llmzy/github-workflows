name: 'Configure Git Signing'
description: 'Configure Git commit signing with GPG'

inputs:
  private_key:
    description: 'GPG private key to import'
    required: true
  github_token:
    description: 'GitHub token for git config'
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure Git signing
      shell: bash
      run: |
        echo "Step 1: Creating .gnupg directory"
        # Create .gnupg directory with correct permissions
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        echo "✓ .gnupg directory created and permissions set"
        
        echo "Step 2: Importing GPG key"
        # Import the private key
        echo "${{ inputs.private_key }}" | gpg --batch --import
        echo "✓ GPG key imported successfully"
        
        echo "Step 3: Getting key ID"
        # Get the key ID
        KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
        echo "✓ Key ID retrieved: $KEY_ID"
        
        echo "Step 4: Getting email from GPG key"
        # Debug output for key information
        echo "Debug: Key information:"
        gpg --list-secret-keys --keyid-format LONG | sed 's/\(<.*>\)/EMAIL_MASKED/g'
        
        # Get email from GPG key
        GPG_EMAIL=$(gpg --list-secret-keys --keyid-format LONG | grep -A 1 "sec" | tail -n 1 | sed 's/.*<\(.*\)>.*/\1/')
        echo "✓ GPG email retrieved (masked): <EMAIL_MASKED>"
        
        echo "Step 5: Comparing emails"
        # Get email from GitHub token
        GH_EMAIL=$(curl -s -H "Authorization: token ${{ inputs.github_token }}" https://api.github.com/user | jq -r .email)
        # Compare emails (output is masked for security)
        if [ "$GPG_EMAIL" != "$GH_EMAIL" ]; then
          echo "Warning: Email from GPG key does not match GitHub token email"
        fi
        echo "✓ Email comparison completed"
        
        echo "Step 6: Configuring Git"
        # Configure Git
        git config --global user.signingkey "$KEY_ID"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true
        git config --global tag.forceSignAnnotated true
        git config --global gpg.program gpg
        echo "✓ Git configuration completed"
        
        echo "Step 7: Configuring GPG agent"
        # Configure GPG agent
        echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf
        echo 'pinentry-mode loopback' > ~/.gnupg/gpg.conf
        gpgconf --kill gpg-agent || true
        echo "✓ GPG agent configured"
        
        echo "Step 8: Testing GPG signing"
        # Create a temporary file for testing
        TEST_FILE=$(mktemp)
        if echo "test" | gpg --clearsign > "$TEST_FILE" 2>/dev/null; then
          rm -f "$TEST_FILE"
          echo "✓ GPG signing test successful"
        else
          rm -f "$TEST_FILE"
          echo "Failed to test GPG signing"
          exit 1
        fi 