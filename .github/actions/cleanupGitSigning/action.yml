name: 'Cleanup Git Signing'
description: 'Removes Git signing configuration and cleans up sensitive data'

runs:
  using: "composite"
  steps:
    - name: Cleanup Git signing configuration
      shell: bash
      run: |
        echo "Step 1: Removing Git configuration"
        # Remove all Git signing configuration
        git config --global --unset user.signingkey || true
        git config --global --unset commit.gpgsign || true
        git config --global --unset gpg.program || true
        git config --global --unset user.email || true
        git config --global --unset user.name || true
        echo "✓ Git configuration removed"
        
        echo "Step 2: Cleaning up GPG configuration"
        # Kill any existing gpg-agent first
        gpgconf --kill gpg-agent || true
        
        # Clean up GPG configuration
        if [ -d ~/.gnupg ]; then
          rm -rf ~/.gnupg
          echo "✓ GPG directory removed"
        else
          echo "✓ No GPG directory found to clean"
        fi
        
        echo "Step 3: Clearing environment"
        # Clear any sensitive environment variables
        unset GPG_TTY || true
        unset GPG_AGENT_INFO || true
        unset GPG_KEY_ID || true
        echo "✓ Environment variables cleared"
        
        echo "All cleanup steps completed successfully" 