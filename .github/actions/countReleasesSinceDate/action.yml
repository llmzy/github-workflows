name: Count Releases Since Date
description: Counts the number of semver-compliant releases (git tags) since a specified date

inputs:
  cutoff-date:
    description: 'Date in YYYY-MM-DD format from which to count releases'
    required: true
  default-count:
    description: 'Default count to return if the cutoff date is invalid or no releases are found'
    required: false
    default: '0'
  tag-prefix:
    description: 'Optional prefix for semver tags (e.g., "v")'
    required: false
    default: ''

outputs:
  release-count:
    description: 'Number of releases (semver git tags) since the cutoff date'
    value: ${{ steps.count.outputs.release_count }}

runs:
  using: "composite"
  steps:
    - name: Count releases since cutoff date
      id: count
      shell: bash
      run: |
        CUTOFF_DATE="${{ inputs.cutoff-date }}"
        DEFAULT_COUNT="${{ inputs.default-count }}"
        TAG_PREFIX="${{ inputs.tag-prefix }}"
        
        echo "Using cutoff date: $CUTOFF_DATE"
        
        # Validate date format
        if ! [[ $CUTOFF_DATE =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          echo "::warning::Invalid date format. Expected YYYY-MM-DD, got $CUTOFF_DATE. Using default count: $DEFAULT_COUNT"
          echo "release_count=$DEFAULT_COUNT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        
        # Debug - show all available tags with dates
        echo "All available tags with dates:"
        git for-each-ref --sort=-creatordate --format="%(creatordate:iso) %(refname:short)" refs/tags | head -n 10
        echo "..."
        
        # Get all semver tags sorted by date and count those after the cutoff
        # Using a simple approach with grep
        if [ -n "$TAG_PREFIX" ]; then
          # Only match tags with the exact prefix
          matching_tags=$(git for-each-ref --sort=creatordate --format="%(creatordate:iso) %(refname:short)" refs/tags | 
                        grep "^2" | # Only lines starting with date (2xxx year)
                        grep -E "${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+" | # Match semver format with prefix
                        awk -v date="$CUTOFF_DATE" '$1 >= date {print}')
        else
          # Match with or without v prefix
          matching_tags=$(git for-each-ref --sort=creatordate --format="%(creatordate:iso) %(refname:short)" refs/tags | 
                       grep "^2" | # Only lines starting with date (2xxx year)
                       grep -E "[0-9]+\.[0-9]+\.[0-9]+" | # Match any semver format
                       awk -v date="$CUTOFF_DATE" '$1 >= date {print}')
        fi
        
        # Count matching tags
        if [ -z "$matching_tags" ]; then
          count=0
        else
          count=$(echo "$matching_tags" | wc -l)
          count=$(echo "$count" | tr -d '[:space:]') # Trim whitespace
        fi
        
        echo "Semver tags since $CUTOFF_DATE:"
        echo "$matching_tags"
        echo "----------"
        echo "Found $count semver releases since $CUTOFF_DATE"
        
        # If no releases found, use the default
        if [ "$count" -eq "0" ]; then
          echo "No semver releases found since cutoff date, using default count: $DEFAULT_COUNT"
          count="$DEFAULT_COUNT"
        fi
        
        echo "release_count=$count" >> "$GITHUB_OUTPUT" 
